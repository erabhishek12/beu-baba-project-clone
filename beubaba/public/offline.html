<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BEU BABA — Offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1a2233;
        background:
          radial-gradient(900px 600px at 10% -10%, rgba(69,96,176,0.10), transparent 55%),
          radial-gradient(700px 500px at 100% 0%, rgba(200,145,42,0.08), transparent 50%),
          linear-gradient(180deg, #f5f6fc 0%, #eff1f7 100%);
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 400px;
        text-align: center;
        background: rgba(255,255,255,0.86);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 28px;
        padding: 40px 28px;
        box-shadow: 0 24px 60px -24px rgba(26,34,51,0.28);
      }
      img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 12px; }
      h1 { font-size: 22px; margin: 8px 0 6px; }
      p { color: #5b6577; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
      button {
        border: none;
        background: #4560b0;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 13px 24px;
        border-radius: 14px;
        cursor: pointer;
      }
      button:active { background: #37509a; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/assets/mascot.webp" alt="BEU BABA" onerror="this.style.display='none'" />
      <h1>You're offline</h1>
      <p>BEU BABA needs a connection to load fresh content. Your cached study material is still available once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
